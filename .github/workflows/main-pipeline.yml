name: Main DevSecOps Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/reusable-build.yml
    with:
      go-version: "1.25.13"

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      go-version: "1.25.13"

  sonarcloud:
    name: SonarCloud
    uses: ./.github/workflows/reusable-sonarcloud.yml
    with:
      go-version: "1.25.13"

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk:
    name: Snyk Security
    uses: ./.github/workflows/reusable-snyk.yml

    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy:
    name: Deploy to EC2

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - build
      - unit-tests
      - sonarcloud
      - snyk

    uses: ./.github/workflows/reusable-deploy.yml

    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}