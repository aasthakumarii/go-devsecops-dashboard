name: Reusable - OWASP ZAP Dynamic Scan

on:
  workflow_call:
    secrets:
      EC2_HOST:
        required: true

permissions:
  contents: read

jobs:
  zap:
    name: zap-dynamic-scan
    runs-on: ubuntu-latest

    env:
      TARGET_URL: http://${{ secrets.EC2_HOST }}:8080

    steps:
      - name: Create ZAP report directory
        shell: bash
        run: |
          mkdir -p reports/dynamic/zap

      - name: Verify application is reachable
        shell: bash
        run: |
          echo "Checking $TARGET_URL/health"

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "${TARGET_URL}/health"

      - name: Run OWASP ZAP baseline scan
        id: zap
        shell: bash
        continue-on-error: true
        run: |
          set +e

          docker run \
            --rm \
            --network host \
            -v "${{ github.workspace }}/reports/dynamic/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${TARGET_URL}" \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            2>&1 | tee reports/dynamic/zap/zap.log

          ZAP_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$ZAP_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Write ZAP summary
        if: always()
        shell: bash
        run: |
          echo "## OWASP ZAP Dynamic Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          EXIT_CODE="${{ steps.zap.outputs.exit_code }}"

          case "$EXIT_CODE" in
            0)
              echo "**Status:** PASS" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "No ZAP warnings or failures were reported." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "**Status:** FAIL" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "OWASP ZAP found at least one FAIL-level issue." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "**Status:** WARNING" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "OWASP ZAP found warning-level issues." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "**Status:** ERROR" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "OWASP ZAP did not complete successfully." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Recent output" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          tail -n 60 reports/dynamic/zap/zap.log \
            >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-dynamic-reports-${{ github.run_id }}
          path: |
            reports/dynamic/zap/zap-report.html
            reports/dynamic/zap/zap-report.json
            reports/dynamic/zap/zap-report.md
            reports/dynamic/zap/zap.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail job on ZAP failure
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.zap.outputs.exit_code }}"

          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE=3
          fi

          if [ "$EXIT_CODE" = "1" ] || [ "$EXIT_CODE" -gt "2" ]; then
            echo "OWASP ZAP dynamic scan failed."
            exit 1
          fi

          echo "OWASP ZAP scan completed."