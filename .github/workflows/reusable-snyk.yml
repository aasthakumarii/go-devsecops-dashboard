name: Reusable - Snyk Security Scan

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  snyk:
    name: snyk-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache: false

      - name: Create Snyk report directory
        shell: bash
        run: |
          mkdir -p reports/security/snyk

      - name: Install Snyk CLI
        shell: bash
        run: |
          npm install \
            --global \
            --ignore-scripts \
            snyk@1.1306.4

          snyk --version

      - name: Authenticate Snyk
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"

      - name: Run Snyk Open Source scan
        id: snyk-scan
        shell: bash
        continue-on-error: true
        run: |
          set +e

          snyk test \
            --all-projects \
            --json \
            > reports/security/snyk/snyk-results.json

          SNYK_EXIT_CODE=$?

          echo "exit_code=$SNYK_EXIT_CODE" >> "$GITHUB_OUTPUT"

          snyk test \
            --all-projects \
            2>&1 | tee reports/security/snyk/snyk-results.txt

          exit 0

      - name: Write Snyk summary
        if: always()
        shell: bash
        run: |
          echo "## Snyk Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          EXIT_CODE="${{ steps.snyk-scan.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "0" ]; then
            echo "**Status:** PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No blocking vulnerabilities were detected." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** FAIL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Snyk detected one or more vulnerabilities." \
              >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Scan output" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            tail -n 60 reports/security/snyk/snyk-results.txt \
              >> "$GITHUB_STEP_SUMMARY" || true

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snyk-security-reports-${{ github.run_id }}
          path: |
            reports/security/snyk/snyk-results.json
            reports/security/snyk/snyk-results.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail job when Snyk finds vulnerabilities
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.snyk-scan.outputs.exit_code }}"

          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE=1
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Snyk security scan failed."
            exit 1
          fi

          echo "Snyk security scan passed."