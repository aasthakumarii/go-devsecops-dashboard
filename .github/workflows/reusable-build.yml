name: Reusable - Go Build

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version used for the build
        required: false
        type: string
        default: "1.23"

    outputs:
      status:
        description: Build result
        value: ${{ jobs.build.outputs.status }}

permissions:
  contents: read

jobs:
  build:
    name: go-build
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.build-result.outputs.status }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Show Go version
        run: go version

      - name: Verify formatting
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)

          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

          echo "All Go files are correctly formatted."

      - name: Build application
        id: build
        shell: bash
        run: |
          mkdir -p build

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
            -o build/go-devsecops-dashboard \
            .

      - name: Determine build status
        id: build-result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload compiled binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: go-build-${{ github.run_id }}
          path: build/go-devsecops-dashboard
          retention-days: 7